[project]
name = "va-petitions"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "cookiecutter>=2.7.1",
    "django>=6.0.6",
    "django-environ>=0.13.0",
    "django-import-export>=4.4.1",
    "django-tailwind>=4.4.2",
    "django-unfold>=0.99.0",
    "geopy>=2.4.1",
    "markdown>=3.10.2",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.1",
    "whitenoise>=6.6.0",
]

[tool.ruff.lint]
select = ["DJ", "E", "F", "W", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Django-generated migrations trip RUF012 (mutable class attr) on their
# standard dependencies/operations lists; not worth annotating generated code.
"**/migrations/*.py" = ["RUF012", "E501"]
# ModelAdmin config (list_display, list_filter, etc.) is always class-level
# by Django's own contract; annotating each one is noise, not a real fix.
"**/admin.py" = ["RUF012"]
# Django's stock AUTH_PASSWORD_VALIDATORS dotted paths can't be wrapped.
"**/settings.py" = ["E501"]
